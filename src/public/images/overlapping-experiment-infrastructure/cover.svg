    <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M430 24V82H403V112H448V230H403V260H470V378H403V408H440V496" stroke="#c2185b" stroke-width="6"/>
      <path d="M398 82H230V112" stroke="#8d91a0" stroke-width="3" stroke-dasharray="7 7"/>
      <path d="M448 230H252V260" stroke="#8d91a0" stroke-width="3" stroke-dasharray="7 7"/>
      <path d="M470 378H222V408" stroke="#8d91a0" stroke-width="3" stroke-dasharray="7 7"/>
    </g>

    <g fill="#ffffff" stroke="#c2185b" stroke-width="4">
      <circle cx="403" cy="112" r="9"/>
      <circle cx="403" cy="260" r="9"/>
      <circle cx="403" cy="408" r="9"/>
    </g>
    <path d="M440 504l-9-15h18z" fill="#c2185b"/>
    <text x="394" y="20" fill="#c2185b" font-size="12" font-family="Roboto, Arial, sans-serif" font-weight="700" letter-spacing="1.5">REQUEST 042</text>
  </g>
